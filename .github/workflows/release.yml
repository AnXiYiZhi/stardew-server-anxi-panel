name: Promote validated panel candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated annotated tag to promote
        required: false
        type: string
      manual_signoff:
        description: Owner sign-off JSON for an exact candidate. Leave tag empty.
        required: false
        type: string

concurrency:
  group: release-panel-promotion
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write

env:
  DOCKERHUB_IMAGE: anxiyizhi/stardew-server-anxi-panel
  ACR_REGISTRY: crpi-9z3bkb9g7fxeohrg.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_IMAGE: crpi-9z3bkb9g7fxeohrg.cn-hangzhou.personal.cr.aliyuncs.com/anxi-panel/stardew-server-anxi-panel
  GHCR_IMAGE: ghcr.io/anxiyizhi/stardew-server-anxi-panel

jobs:
  release:
    name: Promote exact candidate digest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve release entry
        id: entry
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MANUAL_SIGNOFF: ${{ inputs.manual_signoff }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
        run: |
          set -euo pipefail
          if [[ -n "$MANUAL_SIGNOFF" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                  -n "$INPUT_TAG" || "$GITHUB_ACTOR_ID" != "$REPOSITORY_OWNER_ID" ]]; then
              echo 'manual sign-off requires a repository owner dispatch on main with no tag input' >&2
              exit 1
            fi
            printf '%s\n' "$MANUAL_SIGNOFF" >"$RUNNER_TEMP/manual-signoff-input.json"
            echo 'manual=true' >>"$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          else
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo 'release tag must be v followed by an exact stable semantic version' >&2
              exit 1
            fi
            echo "ref=refs/tags/$tag" >>"$GITHUB_OUTPUT"
            echo "tag=$tag" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.entry.outputs.ref }}
          fetch-depth: 0

      - name: Verify release identity and synchronized main
        id: identity
        shell: bash
        env:
          INPUT_TAG: ${{ steps.entry.outputs.tag }}
          MANUAL_SIGNOFF: ${{ steps.entry.outputs.manual }}
        run: |
          set -euo pipefail
          tag_acceptance_run_id=""
          if [[ "$MANUAL_SIGNOFF" == true ]]; then
            signoff="$RUNNER_TEMP/manual-signoff-input.json"
            version="$(jq -er '.version | strings' "$signoff")"
            commit="$(jq -er '.commit | strings' "$signoff")"
            tag_candidate_run_id="$(jq -er '.candidateWorkflowRunId | strings' "$signoff")"
            tag_candidate_digest="$(jq -er '.digest | strings' "$signoff")"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ||
                  ! "$commit" =~ ^[0-9a-f]{40}$ || ! "$tag_candidate_run_id" =~ ^[1-9][0-9]*$ ||
                  ! "$tag_candidate_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo 'manual sign-off requires exact version, commit, candidate run and digest' >&2
              exit 1
            fi
            tag="v$version"
            release_head="$GITHUB_SHA"
          else
            tag="$INPUT_TAG"
            version="${tag#v}"
            if [[ "$(git cat-file -t "refs/tags/$tag")" != tag ]]; then
              echo 'release tag must be annotated' >&2
              exit 1
            fi
            commit="$(git rev-parse "$tag^{}")"
            release_head="$commit"
            tag_contents="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
            tag_candidate_run_id=""
            tag_candidate_digest=""
            tag_candidate_run_count=0
            tag_candidate_digest_count=0
            while IFS= read -r line; do
              if [[ "$line" =~ ^Candidate\ workflow:\ ([0-9]+)$ ]]; then
                tag_candidate_run_id="${BASH_REMATCH[1]}"
                tag_candidate_run_count=$((tag_candidate_run_count + 1))
              elif [[ "$line" =~ ^Digest:\ (sha256:[0-9a-f]{64})$ ]]; then
                tag_candidate_digest="${BASH_REMATCH[1]}"
                tag_candidate_digest_count=$((tag_candidate_digest_count + 1))
              elif [[ "$line" =~ ^Acceptance\ workflow:\ ([0-9]+)$ ]]; then
                [[ -z "$tag_acceptance_run_id" ]]
                tag_acceptance_run_id="${BASH_REMATCH[1]}"
              fi
            done <<<"$tag_contents"
            if ((tag_candidate_run_count != 1 || tag_candidate_digest_count != 1)); then
              echo 'release tag must contain exactly one candidate workflow and digest binding' >&2
              exit 1
            fi
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git rev-parse origin/main)" != "$release_head" ]]; then
            echo 'release control commit must exactly match origin/main' >&2
            exit 1
          fi
          short_sha="${commit:0:12}"
          artifact_name="release-candidate-$version-$short_sha"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "release_head=$release_head"
            echo "short_sha=$short_sha"
            echo "artifact_name=$artifact_name"
            echo "tag_candidate_run_id=$tag_candidate_run_id"
            echo "tag_candidate_digest=$tag_candidate_digest"
            echo "tag_acceptance_run_id=$tag_acceptance_run_id"
          } >>"$GITHUB_OUTPUT"

      - name: Download successful candidate proof
        id: proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.identity.outputs.artifact_name }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
          TAG_CANDIDATE_RUN_ID: ${{ steps.identity.outputs.tag_candidate_run_id }}
          TAG_CANDIDATE_DIGEST: ${{ steps.identity.outputs.tag_candidate_digest }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/candidate-proof"
          mkdir -p "$proof_dir"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TAG_CANDIDATE_RUN_ID")"
          if ! jq -e --arg sha "$EXPECTED_COMMIT" --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/release-candidate.yml"' <<<"$run_json" >/dev/null; then
            echo "annotated tag candidate workflow is not a successful release-candidate run for this exact main commit" >&2
            exit 1
          fi
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TAG_CANDIDATE_RUN_ID/artifacts")"
          artifact_count="$(jq -r --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and (.expired | not))] | length' <<<"$artifacts_json")"
          if [[ "$artifact_count" != 1 ]]; then
            echo "annotated tag candidate workflow must expose exactly one unexpired immutable proof artifact" >&2
            exit 1
          fi
          gh run download "$TAG_CANDIDATE_RUN_ID" --name "$ARTIFACT_NAME" --dir "$proof_dir"
          if [[ ! -s "$proof_dir/candidate.json" ]]; then
            echo "annotated tag candidate proof is missing" >&2
            exit 1
          fi
          selected_run="$TAG_CANDIDATE_RUN_ID"
          proof="$proof_dir/candidate.json"
          schema="$(jq -r '.schemaVersion // 0' "$proof")"
          version="$(jq -r '.version // empty' "$proof")"
          previous="$(jq -r '.previousVersion // empty' "$proof")"
          oldest="$(jq -r '.oldestTestedVersion // empty' "$proof")"
          commit="$(jq -r '.commit // empty' "$proof")"
          candidate_ref="$(jq -r '.candidateRef // empty' "$proof")"
          digest="$(jq -r '.digest // empty' "$proof")"
          proof_run_id="$(jq -r '.workflowRunId // empty' "$proof")"
          expected_ref="$GHCR_IMAGE:candidate-$EXPECTED_VERSION-$EXPECTED_SHORT_SHA"
          if [[ "$schema" != 1 || "$version" != "$EXPECTED_VERSION" || "$commit" != "$EXPECTED_COMMIT" || "$proof_run_id" != "$selected_run" || "$candidate_ref" != "$expected_ref" || "$digest" != "$TAG_CANDIDATE_DIGEST" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate proof identity does not match the immutable release tag" >&2
            jq '{schemaVersion,version,previousVersion,oldestTestedVersion,commit,workflowRunId,candidateRef,digest}' "$proof" >&2
            exit 1
          fi
          latest_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | python3 scripts/panel_release_policy.py newest)"
          latest_release="${latest_release#v}"
          if [[ "$previous" != "$latest_release" && "$version" != "$latest_release" ]]; then
            echo "candidate proof previous version does not match the current latest GitHub Release, and this is not an idempotent retry of the same release: $latest_release" >&2
            exit 1
          fi
          bash scripts/validate-release-matrix.sh --version "$version" --previous-version "$previous" --oldest-version "$oldest" --require-oldest-for-zero-patch
          {
            echo "run_id=$selected_run"
            echo "candidate_ref=$candidate_ref"
            echo "digest=$digest"
            echo "build_date=$(jq -r '.buildDate' "$proof")"
            echo "previous=$previous"
          } >>"$GITHUB_OUTPUT"

      - name: Verify immutable real Docker acceptance
        if: steps.entry.outputs.manual != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN_ID: ${{ steps.identity.outputs.tag_acceptance_run_id }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_SHORT_SHA: ${{ steps.identity.outputs.short_sha }}
        run: |
          set -euo pipefail
          required="$(python3 -c 'import sys; from scripts.candidate_acceptance import requires; print(str(requires(sys.argv[1])).lower())' "$EXPECTED_VERSION")"
          if [[ "$required" != true ]]; then
            exit 0
          fi
          [[ "$ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID")"
          jq -e --arg sha "$EXPECTED_COMMIT" --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/release-acceptance.yml"' <<<"$run_json" >/dev/null
          artifact_name="release-acceptance-$EXPECTED_VERSION-$EXPECTED_SHORT_SHA"
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPTANCE_RUN_ID/artifacts")"
          jq -e --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and (.expired | not))] | length == 1' <<<"$artifacts_json" >/dev/null
          acceptance_dir="$RUNNER_TEMP/specialist-proof"
          mkdir -p "$acceptance_dir"
          gh run download "$ACCEPTANCE_RUN_ID" --name "$artifact_name" --dir "$acceptance_dir"
          python3 scripts/candidate_acceptance.py --candidate "$RUNNER_TEMP/candidate-proof/candidate.json" --acceptance "$acceptance_dir/acceptance.json" --output "$RUNNER_TEMP/verified-acceptance.json" --acceptance-run-id "$ACCEPTANCE_RUN_ID"

      - name: Verify owner sign-off for this candidate
        if: steps.entry.outputs.manual == 'true'
        shell: bash
        env:
          RELEASE_HEAD: ${{ steps.identity.outputs.release_head }}
        run: |
          set -euo pipefail
          python3 -m scripts.manual_release_signoff \
            --candidate "$RUNNER_TEMP/candidate-proof/candidate.json" \
            --signoff "$RUNNER_TEMP/manual-signoff-input.json" \
            --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID" --release-head "$RELEASE_HEAD" \
            --output "$RUNNER_TEMP/manual-signoff.json"

      - name: Upload immutable manual sign-off
        if: steps.entry.outputs.manual == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manual-signoff-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.short_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manual-signoff.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify registry promotion tool
        shell: bash
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null
          skopeo --version

      - name: Authenticate registries
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | skopeo login --username "$GHCR_USERNAME" --password-stdin ghcr.io
          printf '%s' "$DOCKERHUB_TOKEN" | skopeo login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
          printf '%s' "$ACR_PASSWORD" | skopeo login --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"

      - name: Verify candidate digest and OCI identity
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.proof.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.proof.outputs.digest }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_BUILD_DATE: ${{ steps.proof.outputs.build_date }}
        run: |
          set -euo pipefail
          source_repository="${CANDIDATE_REF%:*}"
          skopeo inspect "docker://$source_repository@$EXPECTED_DIGEST" >"$RUNNER_TEMP/candidate-inspect.json"
          actual_digest="$(jq -r '.Digest' "$RUNNER_TEMP/candidate-inspect.json")"
          actual_version="$(jq -r '.Labels["org.opencontainers.image.version"] // empty' "$RUNNER_TEMP/candidate-inspect.json")"
          actual_revision="$(jq -r '.Labels["org.opencontainers.image.revision"] // empty' "$RUNNER_TEMP/candidate-inspect.json")"
          actual_created="$(jq -r '.Labels["org.opencontainers.image.created"] // empty' "$RUNNER_TEMP/candidate-inspect.json")"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" || "$actual_version" != "$EXPECTED_VERSION" || "$actual_revision" != "$EXPECTED_COMMIT" || "$actual_created" != "$EXPECTED_BUILD_DATE" ]]; then
            echo "candidate registry object does not match its validated proof" >&2
            exit 1
          fi

      - name: Seal manually approved candidate and create annotated tag
        if: steps.entry.outputs.manual == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ steps.identity.outputs.release_head }}
          TAG: ${{ steps.identity.outputs.tag }}
          CANDIDATE_REF: ${{ steps.proof.outputs.candidate_ref }}
        run: |
          set -euo pipefail
          signoff="$RUNNER_TEMP/manual-signoff.json"
          commit="$(jq -er '.commit' "$signoff")"
          digest="$(jq -er '.digest' "$signoff")"
          candidate_run_id="$(jq -er '.candidateWorkflowRunId' "$signoff")"
          version="$(jq -er '.version' "$signoff")"
          validation_ref="$(jq -er '.validationRef' "$RUNNER_TEMP/candidate-proof/candidate.json")"
          [[ "$validation_ref" == "$GHCR_IMAGE:validation-$version-${commit:0:12}" ]]
          [[ "$(skopeo inspect --format '{{.Digest}}' "docker://$validation_ref")" == "$digest" ]]

          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_HEAD" ]]
          git fetch --tags origin
          subject="$TAG manually approved candidate"
          annotation="Candidate workflow: $candidate_run_id"$'\n'"Digest: $digest"$'\n'"Manual sign-off workflow: $GITHUB_RUN_ID"
          create_tag=true
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git cat-file -t "refs/tags/$TAG")" != tag || "$(git rev-parse "refs/tags/$TAG^{}")" != "$commit" ||
                  "$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")" != "$subject"$'\n\n'"$annotation" ]]; then
              echo 'existing tag is bound to a different candidate or sign-off run' >&2
              exit 1
            fi
            create_tag=false
          fi

          versions_json="$(gh api --paginate --slurp "users/$GITHUB_REPOSITORY_OWNER/packages/container/stardew-server-anxi-panel/versions?per_page=100")"
          candidate_exists="$(jq -r --arg tag "${CANDIDATE_REF##*:}" 'any(.[][]; .metadata.container.tags | index($tag) != null)' <<<"$versions_json")"
          if [[ "$candidate_exists" == false ]]; then
            skopeo copy --all --preserve-digests "docker://$GHCR_IMAGE@$digest" "docker://$CANDIDATE_REF"
          fi
          [[ "$(skopeo inspect --format '{{.Digest}}' "docker://$CANDIDATE_REF")" == "$digest" ]]
          git fetch --no-tags origin main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$RELEASE_HEAD" ]]
          if [[ "$create_tag" == true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$commit" -m "$subject" -m "$annotation"
            git push origin "refs/tags/$TAG"
          fi

      - name: Promote exact version tags
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.proof.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.proof.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          source_repository="${CANDIDATE_REF%:*}"
          source="docker://$source_repository@$EXPECTED_DIGEST"
          skopeo copy --all --preserve-digests "$source" "docker://$DOCKERHUB_IMAGE:$VERSION"
          skopeo copy --all --preserve-digests "$source" "docker://$ACR_IMAGE:$VERSION"
          skopeo copy --all --preserve-digests "$source" "docker://$GHCR_IMAGE:$VERSION"
          for image in "$DOCKERHUB_IMAGE:$VERSION" "$ACR_IMAGE:$VERSION" "$GHCR_IMAGE:$VERSION"; do
            actual="$(skopeo inspect --format '{{.Digest}}' "docker://$image")"
            if [[ "$actual" != "$EXPECTED_DIGEST" ]]; then
              echo "promoted exact tag digest mismatch: $image -> $actual" >&2
              exit 1
            fi
          done

      - name: Smoke one promoted exact image
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          smoke_image="anxi-promoted-smoke:$VERSION"
          smoke_container="anxi-promoted-smoke-$GITHUB_RUN_ID"
          smoke_volume="anxi-promoted-smoke-$GITHUB_RUN_ID-data"
          cleanup() {
            docker rm -f "$smoke_container" >/dev/null 2>&1 || true
            docker volume rm "$smoke_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          skopeo copy "docker://$GHCR_IMAGE:$VERSION" "docker-daemon:$smoke_image"
          docker volume create --label "com.anxi-panel.test-owner=release-$GITHUB_RUN_ID" "$smoke_volume" >/dev/null
          docker run -d --name "$smoke_container" --label "com.anxi-panel.test-owner=release-$GITHUB_RUN_ID" --mount "type=volume,src=$smoke_volume,dst=/data" "$smoke_image" >/dev/null
          ready=0
          for _ in $(seq 1 120); do
            if docker exec "$smoke_container" wget -qO- http://127.0.0.1:8090/health >"$RUNNER_TEMP/promoted-health.json" 2>/dev/null; then
              if [[ "$(jq -r '.status // empty' "$RUNNER_TEMP/promoted-health.json")" == ok ]]; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if ((ready != 1)); then
            docker logs "$smoke_container" >&2
            exit 1
          fi
          docker exec "$smoke_container" wget -qO- http://127.0.0.1:8090/api/version >"$RUNNER_TEMP/promoted-version.json"
          if [[ "$(jq -r '.version // empty' "$RUNNER_TEMP/promoted-version.json")" != "$VERSION" || "$(jq -r '.commit // empty' "$RUNNER_TEMP/promoted-version.json")" != "$EXPECTED_COMMIT" ]]; then
            cat "$RUNNER_TEMP/promoted-version.json" >&2
            exit 1
          fi

      - name: Promote and verify latest tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ steps.proof.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.proof.outputs.digest }}
          RELEASE_HEAD: ${{ steps.identity.outputs.release_head }}
          PREVIOUS_VERSION: ${{ steps.proof.outputs.previous }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$RELEASE_HEAD" ]]; then
            echo "origin/main changed after exact version promotion; refusing to move latest tags" >&2
            exit 1
          fi
          latest_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | python3 scripts/panel_release_policy.py newest)"
          latest_release="${latest_release#v}"
          if [[ "$latest_release" != "$PREVIOUS_VERSION" && "$latest_release" != "$VERSION" ]]; then
            echo "latest GitHub Release changed after proof validation; refusing to move latest tags: $latest_release" >&2
            exit 1
          fi
          source_repository="${CANDIDATE_REF%:*}"
          source="docker://$source_repository@$EXPECTED_DIGEST"
          skopeo copy --all --preserve-digests "$source" "docker://$DOCKERHUB_IMAGE:latest"
          skopeo copy --all --preserve-digests "$source" "docker://$ACR_IMAGE:latest"
          skopeo copy --all --preserve-digests "$source" "docker://$GHCR_IMAGE:latest"
          for image in "$DOCKERHUB_IMAGE:$VERSION" "$DOCKERHUB_IMAGE:latest" "$ACR_IMAGE:$VERSION" "$ACR_IMAGE:latest" "$GHCR_IMAGE:$VERSION" "$GHCR_IMAGE:latest"; do
            actual="$(skopeo inspect --format '{{.Digest}}' "docker://$image")"
            if [[ "$actual" != "$EXPECTED_DIGEST" ]]; then
              echo "published tag digest mismatch: $image -> $actual" >&2
              exit 1
            fi
          done

      - name: Prepare release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          subject="$(git log -1 --format=%s "$tag^{}")"
          tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
          details="$(printf '%s\n' "$tag_message" | tail -n +2 | sed '/./,$!d')"
          if [[ -z "${details//[[:space:]]/}" ]]; then
            commit_message="$(git log -1 --format=%B "$tag^{}")"
            details="$(printf '%s\n' "$commit_message" | tail -n +2 | sed '/./,$!d')"
          fi
          if [[ -z "${details//[[:space:]]/}" ]]; then
            details="- $subject"
          fi
          public_notes="deploy/updates/${tag#v}.md"
          if [[ -f "$public_notes" ]]; then
            details="$(cat "$public_notes")"
          elif [[ -s "$RUNNER_TEMP/manual-signoff.json" ]]; then
            details="- $subject"
          fi
          previous_tag="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          notes_path="$RUNNER_TEMP/release-notes.md"
          {
            printf '## %s\n\n' "$tag"
            printf '%s\n\n' "$details"
            if [[ -n "$previous_tag" ]]; then
              printf '**完整变更**：https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$previous_tag" "$tag"
            else
              printf '**完整提交记录**：https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$tag"
            fi
          } >"$notes_path"
          python3 scripts/panel_release_policy.py notes --version "${tag#v}" --output "$notes_path"
          echo "path=$notes_path" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.identity.outputs.tag }}
          name: Stardew Server Anxi Panel ${{ steps.identity.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: ${{ steps.identity.outputs.version == '0.7.3' && 'true' || 'false' }}
          files: |
            deploy/run.sh
            deploy/migrate-fnos.sh
            deploy/repair-junimo-0.3.5.sh
            deploy/repair-junimo-upgrade.sh

      - name: Release summary
        shell: bash
        run: |
          {
            echo "## Validated candidate promoted"
            echo
            echo "- Candidate workflow: \`${{ steps.proof.outputs.run_id }}\`"
            echo "- Commit: \`${{ steps.identity.outputs.commit }}\`"
            echo "- Digest: \`${{ steps.proof.outputs.digest }}\`"
            echo "- The release workflow did not rebuild the image."
            if [[ -s "$RUNNER_TEMP/manual-signoff.json" ]]; then
              jq -r '"- Manual sign-off by @" + .approvedBy, "- Evidence SHA256: " + .evidenceSha256, "- Checks without candidate-bound evidence: " + (.checksWithoutCandidateEvidence | join(", "))' "$RUNNER_TEMP/manual-signoff.json"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

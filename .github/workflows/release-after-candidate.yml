name: Tag validated release candidate

on:
  workflow_run:
    workflows:
      - "Validate release candidate"
      - "Validate real Docker candidate acceptance"
    types:
      - completed

concurrency:
  group: tag-validated-candidate-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Tag the still-current validated main commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event != 'push' || !contains(github.event.workflow_run.head_commit.message, '[manual-release-candidate]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve validated candidate and specialist acceptance
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          acceptance_run_id=""
          candidate_run_id="$SOURCE_RUN_ID"
          if [[ "$SOURCE_PATH" == .github/workflows/release-acceptance.yml ]]; then
            acceptance_run_id="$SOURCE_RUN_ID"
            acceptance_dir="$RUNNER_TEMP/specialist-proof"
            mkdir -p "$acceptance_dir"
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts")"
            mapfile -t names < <(jq -r '.artifacts[] | select((.name | startswith("release-acceptance-")) and (.expired | not)) | .name' <<<"$artifacts_json")
            [[ "${#names[@]}" -eq 1 ]]
            gh run download "$SOURCE_RUN_ID" --name "${names[0]}" --dir "$acceptance_dir"
            acceptance="$acceptance_dir/acceptance.json"
            jq -e --arg sha "$SOURCE_SHA" --arg run "$SOURCE_RUN_ID" '.commit == $sha and .acceptanceWorkflowRunId == $run' "$acceptance" >/dev/null
            candidate_run_id="$(jq -r '.candidateWorkflowRunId' "$acceptance")"
            [[ "$candidate_run_id" =~ ^[1-9][0-9]*$ ]]
          elif [[ "$SOURCE_PATH" != .github/workflows/release-candidate.yml ]]; then
            echo 'unrecognized source workflow' >&2
            exit 1
          fi
          {
            echo "candidate_run_id=$candidate_run_id"
            echo "acceptance_run_id=$acceptance_run_id"
            echo "commit=$SOURCE_SHA"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: 0

      - name: Download candidate proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.source.outputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/candidate-proof"
          mkdir -p "$proof_dir"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          jq -e --arg sha "$CANDIDATE_COMMIT" --arg repo "$GITHUB_REPOSITORY" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .head_repository.full_name == $repo and .path == ".github/workflows/release-candidate.yml"' <<<"$run_json" >/dev/null
          artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts")"
          mapfile -t artifact_names < <(jq -r '.artifacts[] | select((.name | startswith("release-candidate-")) and (.expired | not)) | .name' <<<"$artifacts_json")
          if [[ "${#artifact_names[@]}" -ne 1 ]]; then
            echo "expected exactly one unexpired candidate proof artifact" >&2
            exit 1
          fi
          gh run download "$CANDIDATE_RUN_ID" --name "${artifact_names[0]}" --dir "$proof_dir"
          if [[ ! -s "$proof_dir/candidate.json" ]]; then
            echo "candidate proof is missing" >&2
            exit 1
          fi

      - name: Require completed real Docker acceptance
        id: acceptance
        shell: bash
        env:
          ACCEPTANCE_RUN_ID: ${{ steps.source.outputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/candidate-proof/candidate.json"
          version="$(jq -r '.version' "$proof")"
          required="$(python3 -c 'import sys; from scripts.candidate_acceptance import requires; print(str(requires(sys.argv[1])).lower())' "$version")"
          if [[ "$required" == true ]]; then
            if [[ -z "$ACCEPTANCE_RUN_ID" ]]; then
              echo 'ready=false' >>"$GITHUB_OUTPUT"
              {
                echo '## Candidate awaiting real Docker acceptance'
                echo
                echo 'The immutable candidate is ready for specialist testing. No tag or promotion is allowed until matching acceptance is sealed.'
              } >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            python3 scripts/candidate_acceptance.py --candidate "$proof" --acceptance "$RUNNER_TEMP/specialist-proof/acceptance.json" --output "$RUNNER_TEMP/verified-acceptance.json" --acceptance-run-id "$ACCEPTANCE_RUN_ID"
          fi
          echo 'ready=true' >>"$GITHUB_OUTPUT"

      - name: Verify current main, create tag, and start promotion
        if: steps.acceptance.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ steps.source.outputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ steps.source.outputs.commit }}
          ACCEPTANCE_RUN_ID: ${{ steps.source.outputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/candidate-proof/candidate.json"
          schema="$(jq -r '.schemaVersion // 0' "$proof")"
          version="$(jq -r '.version // empty' "$proof")"
          previous="$(jq -r '.previousVersion // empty' "$proof")"
          oldest="$(jq -r '.oldestTestedVersion // empty' "$proof")"
          commit="$(jq -r '.commit // empty' "$proof")"
          workflow_run_id="$(jq -r '.workflowRunId // empty' "$proof")"
          candidate_ref="$(jq -r '.candidateRef // empty' "$proof")"
          digest="$(jq -r '.digest // empty' "$proof")"
          expected_ref="ghcr.io/anxiyizhi/stardew-server-anxi-panel:candidate-$version-${commit:0:12}"
          if [[ "$schema" != 1 || ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$commit" != "$CANDIDATE_COMMIT" || "$workflow_run_id" != "$CANDIDATE_RUN_ID" || "$candidate_ref" != "$expected_ref" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "candidate proof does not match the completed workflow run" >&2
            exit 1
          fi
          latest_release="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | python3 scripts/panel_release_policy.py newest)"
          latest_release="${latest_release#v}"
          if [[ "$previous" != "$latest_release" && "$version" != "$latest_release" ]]; then
            echo "candidate proof does not match the current previous release or an idempotent same-version retry: $latest_release" >&2
            exit 1
          fi
          bash scripts/validate-release-matrix.sh --version "$version" --previous-version "$previous" --oldest-version "$oldest" --require-oldest-for-zero-patch

          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --tags origin
          if [[ "$(git rev-parse origin/main)" != "$commit" ]]; then
            {
              echo "## Candidate superseded"
              echo
              echo "Validated commit \`$commit\` is no longer current \`origin/main\`; no tag or release was created."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tag="v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            if [[ "$(git cat-file -t "refs/tags/$tag")" != tag || "$(git rev-parse "$tag^{}")" != "$commit" ]]; then
              echo "existing tag $tag does not match the validated commit" >&2
              exit 1
            fi
            tag_contents="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
            tag_candidate_run_id=""
            tag_candidate_digest=""
            tag_acceptance_run_id=""
            tag_candidate_run_count=0
            tag_candidate_digest_count=0
            while IFS= read -r line; do
              if [[ "$line" =~ ^Candidate\ workflow:\ ([0-9]+)$ ]]; then
                tag_candidate_run_id="${BASH_REMATCH[1]}"
                tag_candidate_run_count=$((tag_candidate_run_count + 1))
              elif [[ "$line" =~ ^Digest:\ (sha256:[0-9a-f]{64})$ ]]; then
                tag_candidate_digest="${BASH_REMATCH[1]}"
                tag_candidate_digest_count=$((tag_candidate_digest_count + 1))
              elif [[ "$line" =~ ^Acceptance\ workflow:\ ([0-9]+)$ ]]; then
                [[ -z "$tag_acceptance_run_id" ]]
                tag_acceptance_run_id="${BASH_REMATCH[1]}"
              fi
            done <<<"$tag_contents"
            if ((tag_candidate_run_count != 1 || tag_candidate_digest_count != 1)) ||
              [[ "$tag_candidate_run_id" != "$CANDIDATE_RUN_ID" || "$tag_candidate_digest" != "$digest" ]]; then
              echo "existing tag $tag is bound to a different or malformed immutable candidate" >&2
              exit 1
            fi
            if [[ "$tag_acceptance_run_id" != "$ACCEPTANCE_RUN_ID" ]]; then
              echo 'existing tag is bound to a different specialist acceptance' >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            annotation="Candidate workflow: $CANDIDATE_RUN_ID"$'\n'"Digest: $digest"
            if [[ -n "$ACCEPTANCE_RUN_ID" ]]; then
              annotation+=$'\n'"Acceptance workflow: $ACCEPTANCE_RUN_ID"
            fi
            git tag -a "$tag" "$commit" -m "$tag validated candidate" -m "$annotation"
            git push origin "refs/tags/$tag"
          fi

          promotion_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$commit&per_page=100")"
          existing_promotion="$(jq -r '.workflow_runs[0].id // empty' <<<"$promotion_runs")"
          if [[ -z "$existing_promotion" ]]; then
            gh workflow run release.yml --ref main -f "tag=$tag"
          else
            echo "promotion run $existing_promotion already exists; inspect or resume it without dispatching a duplicate"
          fi
          {
            echo "## Formal promotion dispatched"
            echo
            echo "- Tag: \`$tag\`"
            echo "- Commit: \`$commit\`"
            echo "- Candidate workflow: \`$CANDIDATE_RUN_ID\`"
            echo "- Digest: \`$digest\`"
          } >>"$GITHUB_STEP_SUMMARY"
